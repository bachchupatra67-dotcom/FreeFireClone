<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Free Fire - Combat & Skins Update</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #87ceeb; font-family: sans-serif; }
    #game-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 10px; height: 10px; border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 50%;
    }
    #header-hud { position: absolute; top: 15px; left: 15px; display: flex; flex-direction: column; gap: 6px; }
    .hud-card {
      background: rgba(0, 0, 0, 0.6); padding: 6px 12px; border-radius: 8px; color: #fff;
      font-size: 13px; font-weight: bold; border: 1px solid rgba(255, 255, 255, 0.2);
    }
    #health-bar-bg { width: 140px; height: 12px; background: #444; border-radius: 6px; margin-top: 3px; border: 1px solid #222; }
    #health-bar-fill { width: 100%; height: 100%; background: #2ecc71; transition: width 0.2s ease, background-color 0.2s ease; }
    #joystick-zone { position: absolute; bottom: 25px; left: 25px; width: 120px; height: 120px; pointer-events: auto; }
    #joystick-base {
      width: 100%; height: 100%; border-radius: 50%; background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.4); display: flex; align-items: center; justify-content: center;
    }
    #joystick-handle { width: 46px; height: 46px; border-radius: 50%; background: rgba(255, 255, 255, 0.85); }
    #controls-zone {
      position: absolute; bottom: 25px; right: 25px; display: flex; flex-direction: column;
      align-items: flex-end; gap: 12px; pointer-events: auto;
    }
    .action-btn { background: rgba(0, 0, 0, 0.65); border: 2px solid #fff; color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .action-btn.active { background: #f39c12; border-color: #f1c40f; }
    #gloo-btn { background: #00bcd4; border-color: #0097a7; padding: 10px 16px; border-radius: 8px; }
    #fire-btn { width: 75px; height: 75px; border-radius: 50%; background: #e74c3c; color: #fff; border: 3px solid #fff; font-weight: bold; font-size: 16px; }
  </style>
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
</head>
<body>
  <div id="game-container"></div>
  <div id="ui-layer">
    <div id="crosshair"></div>
    <div id="header-hud">
      <div class="hud-card">KILLS: <span id="kill-count" style="color: #f1c40f;">0</span></div>
      <div class="hud-card">HP<div id="health-bar-bg"><div id="health-bar-fill" id="hp-fill"></div></div></div>
    </div>
    <div id="joystick-zone"><div id="joystick-base"><div id="joystick-handle"></div></div></div>
    <div id="controls-zone">
      <button id="gloo-btn" class="action-btn">GLOO WALL (5)</button>
      <div>
        <button id="btn-rifle" class="action-btn active">AK-47</button>
        <button id="btn-shotgun" class="action-btn">M1887</button>
      </div>
      <button id="fire-btn">FIRE</button>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      // --- SCENE SETUP ---
      const container = document.getElementById('game-container');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x7ec0ee);
      scene.fog = new THREE.FogExp2(0x7ec0ee, 0.015);

      const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
      hemiLight.position.set(0, 200, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(50, 80, 50);
      dirLight.castShadow = true;
      dirLight.shadow.camera.top = 100; dirLight.shadow.camera.bottom = -100;
      dirLight.shadow.camera.left = -100; dirLight.shadow.camera.right = 100;
      scene.add(dirLight);

      const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshLambertMaterial({ color: 0x3d8c40 }));
      ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
      scene.add(ground);

      // --- PROCEDURAL TREES & ROCKS ---
      function createTree(x, z) {
        const tree = new THREE.Group();
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 3, 8), new THREE.MeshLambertMaterial({ color: 0x5c4033 }));
        trunk.position.y = 1.5; trunk.castShadow = true;
        const leaves = new THREE.Mesh(new THREE.ConeGeometry(2.5, 5, 8), new THREE.MeshLambertMaterial({ color: 0x228b22 }));
        leaves.position.y = 4.5; leaves.castShadow = true;
        tree.add(trunk, leaves); tree.position.set(x, 0, z); scene.add(tree);
      }
      function createRock(x, z, scale) {
        const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(1), new THREE.MeshLambertMaterial({ color: 0x7f8c8d }));
        rock.position.set(x, scale / 2, z); rock.scale.set(scale, scale, scale); rock.castShadow = true; scene.add(rock);
      }
      for(let i = 0; i < 40; i++) {
        createTree((Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200);
        createRock((Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200, Math.random() * 1.5 + 0.5);
      }

      // --- HUMANOID GENERATOR ---
      function createHumanoid(skinColor, shirtColor, pantsColor) {
        const group = new THREE.Group();
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshLambertMaterial({ color: skinColor }));
        head.position.set(0, 1.8, 0); head.castShadow = true;
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.1, 0.5), new THREE.MeshLambertMaterial({ color: shirtColor }));
        torso.position.set(0, 1.0, 0); torso.castShadow = true;
        const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.9, 0.4), new THREE.MeshLambertMaterial({ color: pantsColor }));
        leftLeg.position.set(-0.25, 0.45, 0); leftLeg.castShadow = true;
        const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.9, 0.4), new THREE.MeshLambertMaterial({ color: pantsColor }));
        rightLeg.position.set(0.25, 0.45, 0); rightLeg.castShadow = true;
        group.add(head, torso, leftLeg, rightLeg);
        return group;
      }

      // --- PLAYER & CUSTOM WEAPON SKINS ---
      let playerHP = 100;
      let playerYaw = 0;
      let kills = 0;
            // 1. Create an invisible anchor for the camera and movement
      const player = new THREE.Group();
      
      // 2. Load the realistic Spider-Man GLB model
      const loader = new THREE.GLTFLoader();
      loader.load('spiderman.glb', function(gltf) {
        const spidermanModel = gltf.scene;
        
        // ADJUST THESE NUMBERS based on the downloaded model's size
        spidermanModel.scale.set(0.01, 0.01, 0.01); 
        
        // Adjust this if Spider-Man is floating or sunk into the ground
        spidermanModel.position.set(0, 0, 0); 
        
        // Spin him around if he is running backward
        spidermanModel.rotation.y = Math.PI; 
        
        player.add(spidermanModel);
      });

      scene.add(player);
      // Weapon 1: Custom Sci-Fi Energy Rifle (Code Based)
      // We are naming this 'ak47' so the firing logic below still works!
      let ak47 = new THREE.Group(); 
      
      const darkMetal = new THREE.MeshLambertMaterial({color: 0x222222});
      const neonGlow = new THREE.MeshBasicMaterial({color: 0x00ffcc}); // Glowing cyan
      
      // Main Body
      const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.5), darkMetal);
      gunBody.position.set(0, 0, 0);
      
      // Long Barrel
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.5, 8), darkMetal);
      barrel.rotation.x = Math.PI / 2;
      barrel.position.set(0, 0.03, -0.4);
      
      // Glowing Energy Core
      const core = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.05, 0.25), neonGlow);
      core.position.set(0, 0.03, -0.1);
      
      // Sniper Scope
      const scope = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.2, 8), darkMetal);
      scope.rotation.x = Math.PI / 2;
      scope.position.set(0, 0.12, 0);

      // Grip
      const grip = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.15, 0.1), darkMetal);
      grip.rotation.x = Math.PI / 8;
      grip.position.set(0, -0.1, 0.1);
      
      ak47.add(gunBody, barrel, core, scope, grip);
      
      // Position gun in character's hand
      ak47.position.set(0.4, 1.0, -0.6);
      player.add(ak47);



      // Weapon 2: M1887 Shotgun Skin
      const m1887 = new THREE.Group();
      const sgBarrel = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.9), new THREE.MeshLambertMaterial({color: 0x777777})); // Metal
      sgBarrel.position.set(0, 0, -0.45);
      const sgStock = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.4), new THREE.MeshLambertMaterial({color: 0x5c4033})); // Dark Wood
      sgStock.position.set(0, -0.05, 0.2);
      m1887.add(sgBarrel, sgStock);
      m1887.position.set(0.4, 1.0, -0.6);
      m1887.visible = false; // Hidden by default
      player.add(m1887);

      // --- WEAPON SYSTEM ---
      let currentWeapon = 'rifle';
      const weapons = { rifle: { damage: 35, speed: 1.2, cooldown: 120 }, shotgun: { damage: 25, speed: 0.9, cooldown: 500 } };
      let lastShot = 0; const bullets = [];

      document.getElementById('btn-rifle').onclick = () => {
        currentWeapon = 'rifle';
        document.getElementById('btn-rifle').classList.add('active');
        document.getElementById('btn-shotgun').classList.remove('active');
        ak47.visible = true;
        m1887.visible = false;
      };

      document.getElementById('btn-shotgun').onclick = () => {
        currentWeapon = 'shotgun';
        document.getElementById('btn-shotgun').classList.add('active');
        document.getElementById('btn-rifle').classList.remove('active');
        ak47.visible = false;
        m1887.visible = true;
      };

      document.getElementById('fire-btn').addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (Date.now() - lastShot < weapons[currentWeapon].cooldown) return;
        lastShot = Date.now();
        const spawnBullet = (spread) => {
          const b = new THREE.Mesh(new THREE.SphereGeometry(0.12), new THREE.MeshBasicMaterial({ color: 0xf1c40f }));
          const pos = new THREE.Vector3(); 
          if(currentWeapon === 'rifle') ak47.getWorldPosition(pos); else m1887.getWorldPosition(pos);
          b.position.copy(pos);
          const angle = playerYaw + spread; scene.add(b);
          bullets.push({ mesh: b, dir: new THREE.Vector3(-Math.sin(angle), 0, -Math.cos(angle)).normalize(), life: 60 });
        };
        if (currentWeapon === 'rifle') spawnBullet(0); else [-0.1, -0.03, 0.03, 0.1].forEach(spawnBullet);
      });

      // --- GLOO WALLS ---
      let glooCount = 5;
      const glooWalls = [];
      document.getElementById('gloo-btn').addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (glooCount > 0) {
          const wall = new THREE.Mesh(
            new THREE.CylinderGeometry(2.5, 2.5, 3, 16, 1, false, -Math.PI/2, Math.PI),
            new THREE.MeshLambertMaterial({ color: 0x00ffff, transparent: true, opacity: 0.7, side: THREE.DoubleSide })
          );
          const forward = new THREE.Vector3(-Math.sin(playerYaw), 0, -Math.cos(playerYaw));
          wall.position.copy(player.position).addScaledVector(forward, 3.5);
          wall.position.y = 1.5; wall.rotation.y = playerYaw; wall.castShadow = true;
          scene.add(wall); glooWalls.push(wall);
          glooCount--; document.getElementById('gloo-btn').innerText = `GLOO WALL (${glooCount})`;
          setTimeout(() => { scene.remove(wall); glooWalls.splice(glooWalls.indexOf(wall), 1); }, 8000);
        }
      });

      // --- ENEMIES & HEALTH DAMAGE ---
      const enemies = [];
      function spawnEnemy(x, z) {
        const enemy = createHumanoid(0xffe0bd, 0xe74c3c, 0x222222);
        enemy.position.set(x, 0, z); scene.add(enemy);
        enemies.push({ mesh: enemy, hp: 100, lastAttack: 0 });
      }
      for(let i=0; i<8; i++) spawnEnemy((Math.random()-0.5)*150, (Math.random()-0.5)*150);

      // --- CONTROLS ---
      let moveX = 0, moveZ = 0, touchStartX = 0;
      const joystickZone = document.getElementById('joystick-zone'), joystickHandle = document.getElementById('joystick-handle');
      
      joystickZone.addEventListener('touchmove', (e) => {
        const touch = e.touches[0], rect = joystickZone.getBoundingClientRect();
        const deltaX = touch.clientX - (rect.left + rect.width / 2), deltaY = touch.clientY - (rect.top + rect.height / 2);
        const dist = Math.min(Math.sqrt(deltaX*deltaX + deltaY*deltaY), 35), angle = Math.atan2(deltaY, deltaX);
        joystickHandle.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
        moveX = Math.cos(angle)*dist/35; moveZ = Math.sin(angle)*dist/35;
      });
      joystickZone.addEventListener('touchend', () => { joystickHandle.style.transform = 'translate(0,0)'; moveX = moveZ = 0; });

      window.addEventListener('touchstart', (e) => { for (let i=0; i<e.touches.length; i++) if (e.touches[i].clientX > window.innerWidth/2) touchStartX = e.touches[i].clientX; });
      window.addEventListener('touchmove', (e) => {
        for (let i=0; i<e.touches.length; i++) if (e.touches[i].clientX > window.innerWidth/2) {
          playerYaw -= (e.touches[i].clientX - touchStartX) * 0.006; touchStartX = e.touches[i].clientX;
        }
      });

      // --- GAME LOOP ---
      function animate() {
        requestAnimationFrame(animate);

        player.rotation.y = playerYaw;
        const forward = new THREE.Vector3(-Math.sin(playerYaw), 0, -Math.cos(playerYaw));
        const side = new THREE.Vector3(Math.cos(playerYaw), 0, -Math.sin(playerYaw));
        player.position.addScaledVector(side, moveX * 0.15).addScaledVector(forward, -moveZ * 0.15);

        // X=1.5 (shifts right), Y=3 (lowers height), Z=5 (zooms in closer)
        const camOffset = new THREE.Vector3(1.5, 3, 5).applyAxisAngle(new THREE.Vector3(0, 1, 0), playerYaw);
        camera.position.copy(player.position).add(camOffset);
        
        // Look slightly ahead of the player instead of directly at their back
        const lookTarget = new THREE.Vector3(0, 1.5, -10).applyAxisAngle(new THREE.Vector3(0, 1, 0), playerYaw);
        camera.lookAt(player.position.clone().add(lookTarget));


        // Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.mesh.position.addScaledVector(b.dir, weapons[currentWeapon].speed); b.life--;
          for (let w = 0; w < glooWalls.length; w++) if (b.mesh.position.distanceTo(glooWalls[w].position) < 2.8) b.life = 0;
          
          for (let j = enemies.length - 1; j >= 0; j--) {
            const enemy = enemies[j];
            if (b.mesh.position.distanceTo(enemy.mesh.position) < 1.3) {
              enemy.hp -= weapons[currentWeapon].damage; b.life = 0;
              if (enemy.hp <= 0) {
                scene.remove(enemy.mesh); enemies.splice(j, 1);
                kills++; document.getElementById('kill-count').innerText = kills;
                spawnEnemy((Math.random()-0.5)*150, (Math.random()-0.5)*150);
              }
              break;
            }
          }
          if (b.life <= 0) { scene.remove(b.mesh); bullets.splice(i, 1); }
        }

        // Enemy AI & Player Damage
        const hpBar = document.getElementById('health-bar-fill');
        enemies.forEach(enemy => {
          const distToPlayer = enemy.mesh.position.distanceTo(player.position);
          
          // Enemy attacks if close enough
          if (distToPlayer <= 2.5) {
            if (Date.now() - enemy.lastAttack > 1000) { // 1 second cooldown between hits
              playerHP -= 15;
              hpBar.style.width = Math.max(0, playerHP) + '%';
              hpBar.style.backgroundColor = '#e74c3c'; // Flash red
              setTimeout(() => { hpBar.style.backgroundColor = '#2ecc71'; }, 200); // Return to green
              enemy.lastAttack = Date.now();

              if (playerHP <= 0) {
                alert("YOU WERE ELIMINATED! Respawning...");
                playerHP = 100;
                hpBar.style.width = '100%';
                player.position.set(0, 0, 0); // Reset position
              }
            }
          } else if (distToPlayer < 40) {
            // Chase player if not attacking
            let blocked = false;
            for (let w = 0; w < glooWalls.length; w++) if (enemy.mesh.position.distanceTo(glooWalls[w].position) < 3) blocked = true;
            if (!blocked) {
              const enemyDir = new THREE.Vector3().subVectors(player.position, enemy.mesh.position).normalize();
              enemy.mesh.position.addScaledVector(enemyDir, 0.05);
              enemy.mesh.lookAt(player.position.x, 0, player.position.z);
            }
          }
        });

        renderer.render(scene, camera);
      }
      animate();
    });
  </script>
</body>
</html>
